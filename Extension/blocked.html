<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay Focused | Frame-Out</title>
    <link rel="stylesheet" href="blocked.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="logo">
                <img src="icons/icon128.png" alt="Frame-Out Logo">
            </div>
            <h1 class="headline">STAY FOCUSED</h1>
            <p class="subheadline">This site is locked by Frame-Out to protect your deep work session.</p>
            
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-label">STATUS</span>
                    <span class="stat-value active">FOCUS MODE ACTIVE</span>
                </div>
            </div>

            <div class="quote-container">
                <p class="quote">"The path to excellence is paved with focused hours."</p>
            </div>

            <button class="primary-btn" id="returnBtn">RETURN TO PRODUCTIVITY</button>
        </div>
    </div>
    <script src="blocked.js"></script>
</body>
</html>
